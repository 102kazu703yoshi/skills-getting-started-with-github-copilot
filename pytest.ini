[pytest]
pythonpath = .
testpaths = tests
addopts = --strict-markers

[coverage:run]
source = src
omit =
    */site-packages/*
    */distutils/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
